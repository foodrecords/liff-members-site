<!DOCTYPE html>
<html lang="ja">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AGARUKE POINT CARD</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="loading-overlay" class="loading-overlay">
        <img class="loading-logo" src="foodrecords_logo.png" alt="FOOD RECORDS">
        <div class="loading-spinner"></div>
    </div>

    <main>
        <div class="membership-card" id="membership-card">
            <div class="card-top">
                <span class="card-label">AGARUKE POINT CARD</span>
                <div id="point-card-rank"></div>
            </div>
            <div class="card-center">
                <div class="card-point-area">
                    <p class="point-label">現在のポイント</p>
                    <p id="point-card-balance"><span>0</span><small>pt</small></p>
                    <p id="point-card-get"></p>
                    <p id="point-card-expiry"></p>
                </div>
                <div class="card-rank-area">
                    <div id="point-card-next" class="card-rank-next"></div>
                </div>
            </div>
            <div class="card-footer">
                <div class="card-footer-left">
                    <p id="point-card-name"></p>
                    <p id="point-card-number">No. <span></span></p>
                </div>
                <img class="card-logo" src="foodrecords_logo.png" alt="FOOD RECORDS">
            </div>
        </div>

        <div class="coupon-tabs" id="coupon-tabs">
            <div class="coupon-tab-header">
                <button class="coupon-tab-btn is-active" id="tab-acquired" onclick="switchTab('acquired')">獲得済みの特典</button>
                <button class="coupon-tab-btn" id="tab-exchange" onclick="switchTab('exchange')">ポイントを使う</button>
            </div>
            <div id="tab-panel-acquired">
                <div id="coupon-list">
                    <p class="coupon-empty">読み込み中...</p>
                </div>
            </div>
            <div id="tab-panel-exchange" style="display:none">
                <div id="reward-list">
                    <p class="coupon-empty">読み込み中...</p>
                </div>
            </div>
        </div>
    </main>

    <div class="sticky-button">
        <button id="scan-qr-code" class="scan-button" onclick="scanQR()">
            <i class="fa fa-qrcode"></i>
            QRコードをスキャン
        </button>
    </div>

    <!-- ポイント獲得トースト -->
    <div id="point-toast" class="point-toast">
        <div class="point-toast-inner">
            <p id="point-toast-text"></p>
        </div>
    </div>

    <!-- 初回登録トースト -->
    <div id="welcome-toast" class="welcome-toast">
        <div class="welcome-toast-inner">
            <p>ポイントカードへようこそ！トッピングチケットをプレゼント🎉</p>
        </div>
    </div>

    <!-- エラーバナー -->
    <div id="error-toast" class="error-toast">
        <div class="error-toast-inner">
            <p id="error-toast-text"></p>
        </div>
    </div>

    <!-- クーポン獲得トースト -->
    <div id="coupon-toast" class="coupon-toast">
        <div class="coupon-toast-inner">
            <p id="coupon-toast-text"></p>
        </div>
    </div>

    <!-- ランクアップトースト -->
    <div id="rank-up-toast" class="rank-up-toast">
        <div class="rank-up-toast-inner">
            <p id="rank-up-toast-text"></p>
        </div>
    </div>

    <!-- カスタムダイアログ -->
    <div id="custom-dialog" class="custom-dialog">
        <div class="custom-dialog-overlay" id="dialog-overlay"></div>
        <div class="custom-dialog-content">
            <p id="dialog-message" class="custom-dialog-message"></p>
            <div class="custom-dialog-buttons">
                <button id="dialog-cancel-btn" class="custom-dialog-btn custom-dialog-btn--cancel">キャンセル</button>
                <button id="dialog-ok-btn" class="custom-dialog-btn custom-dialog-btn--ok">OK</button>
            </div>
        </div>
    </div>

    <!-- クーポン詳細モーダル -->
    <div id="coupon-modal" class="coupon-modal">
        <div class="coupon-modal-overlay" id="modal-overlay"></div>
        <div class="coupon-modal-sheet">
            <div class="coupon-modal-handle"></div>
            <div class="coupon-modal-header">
                <h3 id="modal-title" class="coupon-modal-title"></h3>
                <button class="coupon-modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="coupon-modal-body">
                <img id="modal-image" class="coupon-modal-image" src="" alt="" style="display:none;">
                <!-- クーポンコード（ユーザーは使用しない仕様のためコメントアウト）
                <div class="coupon-modal-code-block">
                    <p class="coupon-modal-label">クーポンコード</p>
                    <div class="coupon-modal-code-row">
                        <span id="modal-code" class="coupon-modal-code"></span>
                        <button id="modal-copy-btn" class="coupon-copy-btn">コピー</button>
                    </div>
                </div>
                -->
                <div id="modal-desc-block" class="coupon-modal-desc-block">
                    <p class="coupon-modal-label">ご利用方法</p>
                    <p id="modal-desc" class="coupon-modal-desc"></p>
                </div>
                <p id="modal-expiry" class="coupon-modal-expiry"></p>
            </div>
            <div class="coupon-modal-footer">
                <p id="modal-used-note" class="coupon-modal-used-note"></p>
                <button id="modal-reward-exchange-btn" class="coupon-modal-exchange-btn" style="display:none"></button>
                <button id="modal-store-btn" class="coupon-modal-store-btn">店舗で使用する</button>
                <button id="modal-mobile-btn" class="coupon-modal-mobile-btn">モバイルオーダーで使用する</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
<script src="config.js"></script>
    <script src="liff.js"></script>
    <script src="index.js"></script>
</body>

</html>
