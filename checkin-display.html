<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ポイントカード | AGARUKE LAB.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #fff;
            font-family: 'Noto Sans JP', sans-serif;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2vh 4vw;
        }

        .poster {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        /* ── Header ── */
        .poster-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .h-line { flex: 1; height: 2px; background: #111; }
        .h-text  { font-size: clamp(0.85rem, 1.6vw, 1.2rem); font-weight: 900; letter-spacing: 0.12em; white-space: nowrap; }

        /* ── Heading ── */
        .poster-heading {
            text-align: center;
            line-height: 1.1;
        }
        .heading-pink  { display: block; font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; color: #E83060; }
        .heading-black { display: block; font-size: clamp(3rem, 8vw, 7rem); font-weight: 900; color: #111; }

        /* ── QR area ── */
        .qr-section {
            display: flex;
            justify-content: center;
        }

        .qr-outer {
            position: relative;
            padding: 2vmin;
        }

        /* sparkle marks */
        .spark {
            position: absolute;
            width: 3px;
            border-radius: 2px;
            background: #E83060;
            transform-origin: center;
        }
        .sp1 { height: 2.2vmin; top:  0.3vmin; left: 1.4vmin; transform: rotate(-48deg); }
        .sp2 { height: 1.4vmin; top:  0.9vmin; left: 0.3vmin; transform: rotate(-72deg); }
        .sp3 { height: 2.2vmin; top:  0.3vmin; right: 1.4vmin; transform: rotate(48deg); }
        .sp4 { height: 1.4vmin; top:  0.9vmin; right: 0.3vmin; transform: rotate(72deg); }
        .sp5 { height: 1.8vmin; bottom: 0.5vmin; left: 0.8vmin; transform: rotate(32deg); }
        .sp6 { height: 1.4vmin; bottom: 0.1vmin; left: 2vmin;   transform: rotate(58deg); }
        .sp7 { height: 1.8vmin; bottom: 0.5vmin; right: 0.8vmin; transform: rotate(-32deg); }
        .sp8 { height: 1.4vmin; bottom: 0.1vmin; right: 2vmin;   transform: rotate(-58deg); }

        .qr-frame {
            border: 3px solid #E83060;
            border-radius: 16px;
            padding: 1.5vmin;
            background: #fff;
        }

        #qrcode canvas, #qrcode img { display: block; border-radius: 4px; }

        /* ── Timer ── */
        .timer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: clamp(0.75rem, 1.4vw, 1.1rem);
            color: #aaa;
        }
        .timer-row strong { color: #888; }
        .refresh-btn {
            background: none;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: clamp(0.65rem, 1.2vw, 0.9rem);
            color: #bbb;
            cursor: pointer;
            font-family: inherit;
            margin-left: 8px;
            transition: border-color 0.15s, color 0.15s;
        }
        .refresh-btn:active { border-color: #E83060; color: #E83060; }

        /* ── Bottom grid ── */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(8px, 1.5vw, 20px);
            align-items: start;
        }

        /* Left – benefit */
        .benefit-box {
            background: #FFF0F4;
            border-radius: 14px;
            padding: clamp(10px, 2vh, 24px) clamp(10px, 2vw, 24px) clamp(12px, 2.5vh, 28px);
            text-align: center;
        }
        .benefit-tag {
            display: inline-block;
            background: #E83060;
            color: #fff;
            font-size: clamp(0.72rem, 1.3vw, 1rem);
            font-weight: 700;
            border-radius: 20px;
            padding: 3px 14px;
            margin-bottom: clamp(8px, 1.5vh, 16px);
        }
        .food-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: clamp(8px, 1.5vh, 16px);
        }
        .food-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .food-emoji { font-size: clamp(2rem, 4vw, 3.5rem); line-height: 1; }
        .food-label { font-size: clamp(0.64rem, 1.2vw, 0.95rem); color: #333; }
        .food-or { font-size: clamp(0.78rem, 1.4vw, 1.1rem); font-weight: 700; color: #555; }
        .free-wrap { display: inline-block; position: relative; }
        .free-text {
            font-size: clamp(1.7rem, 5vw, 4rem);
            font-weight: 900;
            color: #E83060;
        }
        .free-underline {
            display: block;
            height: 6px;
            background: #FFE000;
            border-radius: 3px;
            margin-top: -2px;
        }

        /* Right – rank */
        .rank-box { padding: 2px 0; text-align: center; }
        .rank-desc {
            font-size: clamp(0.82rem, 1.5vw, 1.2rem);
            line-height: 1.7;
            text-align: center;
            margin-bottom: clamp(10px, 1.8vh, 20px);
        }
        .rank-desc .pink  { color: #E83060; font-weight: 700; }
        .rank-desc .bold  { font-weight: 900; }
        .rank-desc .ul    { position: relative; display: inline; }
        .rank-desc .ul::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 4px;
            background: #FFE000;
            border-radius: 2px;
        }

        .ranks {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
        }
        .rank-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .rank-circle {
            width: clamp(34px, 5vw, 56px);
            height: clamp(34px, 5vw, 56px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: clamp(1rem, 2vw, 1.6rem);
        }
        .rc-green  { background: #3EAA5C; }
        .rc-bronze { background: #C07830; }
        .rc-silver { background: #A8B0B8; }
        .rc-gold   { background: #D4A800; }
        .rank-name {
            font-size: clamp(0.6rem, 1.1vw, 0.9rem);
            color: #666;
        }
        /* 矢印をサークル中央に揃える */
        .rank-arrow {
            color: #888;
            font-size: clamp(0.9rem, 1.6vw, 1.4rem);
            font-weight: 700;
            padding-top: clamp(9px, 1.8vw, 17px);
        }

        /* ── Setup overlay ── */
        #setup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .setup-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 320px;
            width: 90%;
            text-align: center;
        }
        .setup-card h2 { font-size: 1rem; margin-bottom: 18px; color: #333; }
        #secret-input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 12px;
            font-family: inherit;
        }
        #start-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #E83060;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- セットアップオーバーレイ（URLハッシュがない場合のみ表示） -->
<div id="setup-overlay">
    <div class="setup-card">
        <h2>シークレットキーを入力</h2>
        <input id="secret-input" type="password" placeholder="CHECKIN_SECRET" autocomplete="off">
        <button id="start-btn" onclick="startDisplay()">表示開始</button>
    </div>
</div>

<div class="poster">

    <!-- Header -->
    <div class="poster-header">
        <div class="h-line"></div>
        <span class="h-text">AGARUKE LAB.</span>
        <div class="h-line"></div>
    </div>

    <!-- Heading -->
    <div class="poster-heading">
        <span class="heading-pink">ポイントカード</span>
        <span class="heading-black">始めました！</span>
    </div>

    <!-- QR Code -->
    <div class="qr-section">
        <div class="qr-outer">
            <div class="spark sp1"></div>
            <div class="spark sp2"></div>
            <div class="spark sp3"></div>
            <div class="spark sp4"></div>
            <div class="spark sp5"></div>
            <div class="spark sp6"></div>
            <div class="spark sp7"></div>
            <div class="spark sp8"></div>
            <div class="qr-frame">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>

    <!-- Timer -->
    <div class="timer-row">
        次の更新: <strong id="next-update-time">--:--</strong>
        <button class="refresh-btn" onclick="secret && refreshQR(secret)">今すぐ更新</button>
    </div>

    <!-- Bottom -->
    <div class="bottom-grid">

        <!-- 特典 -->
        <div class="benefit-box">
            <span class="benefit-tag">次回来店時に</span>
            <div class="food-row">
                <div class="food-item">
                    <span class="food-emoji">🥣</span>
                    <span class="food-label">トッピング</span>
                </div>
                <span class="food-or">or</span>
                <div class="food-item">
                    <span class="food-emoji">🍚</span>
                    <span class="food-label">ライス大盛り</span>
                </div>
            </div>
            <div class="free-wrap">
                <span class="free-text">無料！</span>
                <span class="free-underline"></span>
            </div>
        </div>

        <!-- ランク -->
        <div class="rank-box">
            <div class="rank-desc">
                ポイントがたまると<br>
                <span class="pink">ステータスが上がって</span><br>
                <span class="bold">特典が<span class="ul">アップグレード！</span></span>
            </div>
            <div class="ranks">
                <div class="rank-item">
                    <div class="rank-circle rc-green">★</div>
                    <span class="rank-name">Green</span>
                </div>
                <span class="rank-arrow">›</span>
                <div class="rank-item">
                    <div class="rank-circle rc-bronze">★</div>
                    <span class="rank-name">Bronze</span>
                </div>
                <span class="rank-arrow">›</span>
                <div class="rank-item">
                    <div class="rank-circle rc-silver">★</div>
                    <span class="rank-name">Silver</span>
                </div>
                <span class="rank-arrow">›</span>
                <div class="rank-item">
                    <div class="rank-circle rc-gold">★</div>
                    <span class="rank-name">Gold</span>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
    // 3:00/9:00/15:00/21:00 JST (= UTC 0/6/12/18h) に更新する 6 時間ウィンドウ
    const WINDOW_SEC = 6 * 60 * 60;

    var secret = null;
    var qrInstance = null;
    var timerInterval = null;

    // URLハッシュからシークレットを自動取得
    (function () {
        var params = new URLSearchParams(window.location.hash.slice(1));
        var s = params.get('secret');
        if (s) {
            secret = s;
            document.getElementById('setup-overlay').style.display = 'none';
            startDisplayWithSecret(s);
        }
    })();

    function startDisplay() {
        var s = document.getElementById('secret-input').value.trim();
        if (!s) { alert('シークレットキーを入力してください'); return; }
        secret = s;
        document.getElementById('setup-overlay').style.display = 'none';
        startDisplayWithSecret(s);
    }

    function startDisplayWithSecret(s) {
        refreshQR(s);
        startTimer(s);
    }

    // Go の totp.Generate と同じアルゴリズム
    // HMAC-SHA256(secret, BigEndian uint64(floor(unixTs / WINDOW_SEC)))[:12 hex chars]
    async function generateToken(s, unixTs) {
        var w = Math.floor(unixTs / WINDOW_SEC);
        var buf = new ArrayBuffer(8);
        var view = new DataView(buf);
        view.setUint32(0, Math.floor(w / 0x100000000), false);
        view.setUint32(4, w >>> 0, false);
        var key = await crypto.subtle.importKey(
            'raw', new TextEncoder().encode(s),
            { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
        );
        var sig = await crypto.subtle.sign('HMAC', key, buf);
        return Array.from(new Uint8Array(sig))
            .map(function (b) { return b.toString(16).padStart(2, '0'); })
            .join('').substring(0, 12);
    }

    async function refreshQR(s) {
        var token = await generateToken(s, Math.floor(Date.now() / 1000));
        var liffId = window.APP_CONFIG && window.APP_CONFIG.liffId;
        var url = 'https://liff.line.me/' + liffId + '?code=DL_' + token;

        var qrSize = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.42);
        if (qrInstance) {
            qrInstance.clear();
            qrInstance.makeCode(url);
        } else {
            qrInstance = new QRCode(document.getElementById('qrcode'), {
                text: url,
                width: qrSize,
                height: qrSize,
                colorDark: '#111111',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M,
            });
        }
    }

    function getNextUpdateTimeJST() {
        var nowSec = Math.floor(Date.now() / 1000);
        var nextSec = (Math.floor(nowSec / WINDOW_SEC) + 1) * WINDOW_SEC;
        var d = new Date(nextSec * 1000);
        var h = (d.getUTCHours() + 9) % 24;
        var m = d.getUTCMinutes().toString().padStart(2, '0');
        return h + ':' + m;
    }

    function startTimer(s) {
        if (timerInterval) clearInterval(timerInterval);
        var currentWindow = Math.floor(Date.now() / 1000 / WINDOW_SEC);

        function tick() {
            document.getElementById('next-update-time').textContent = getNextUpdateTimeJST();
            var w = Math.floor(Date.now() / 1000 / WINDOW_SEC);
            if (w !== currentWindow) {
                currentWindow = w;
                refreshQR(s);
            }
        }
        tick();
        timerInterval = setInterval(tick, 60000); // 1分ごとに確認
    }
</script>
</body>
</html>
